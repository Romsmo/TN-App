name: mobile-ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and component tests
        run: npm test -- --ci
      - name: JavaScript bundles build for both platforms
        run: npx expo export --platform android --platform ios --output-dir "$RUNNER_TEMP/export"
        env:
          CI: "1"
      - name: The web app builds (as it is built for GitHub Pages)
        run: npm run web:build
        env:
          CI: "1"
          EXPO_BASE_URL: /TN-App

  web-e2e:
    # The web app in a phone-sized Chromium, against the Trafficnetwork client library's own scripted mock server.
    # A mock, not the operator's server; not a real phone and not Safari.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Romsmo/Trafficnetwork
          ref: client-lib-v1.2.0
          path: trafficnetwork
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Build the test variant of the web app
        run: npm run e2e:build
        env:
          CI: "1"
      - name: Browser tests
        run: npm run e2e
        env:
          CI: "1"
          TRAFFICNETWORK_DIR: ${{ github.workspace }}/trafficnetwork
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results

