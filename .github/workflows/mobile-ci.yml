name: mobile-ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and component tests
        run: npm test -- --ci
      - name: JavaScript bundles build for both platforms
        run: npx expo export --platform android --platform ios --output-dir "$RUNNER_TEMP/export"
        env:
          CI: "1"
