# Builds the iOS app on a macOS runner without signing and keeps the .ipa as an artifact.
# Path (b) of docs/ios-install.md: the .ipa is then signed and installed on the iPhone from Windows (xtool / Sideloadly style
# tools, with the owner's own Apple ID, entered by the owner on their machine). Nothing is uploaded to TestFlight or the App Store.
#
# Starts by hand (workflow_dispatch) or when this file changes on the branch flutter: a workflow that only has a manual
# trigger is not registered by GitHub until it is on the default branch, which this repository keeps untouched.
# Standard runners are free in a public repository.
name: ios-unsigned
on:
  push:
    branches: [flutter]
    paths: [".github/workflows/ios-unsigned.yml"]
  workflow_dispatch:
    inputs:
      clientlib_version:
        description: Trafficnetwork client library version
        default: "1.2.1"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.7"
          channel: stable
          cache: true
      - name: Fetch and verify the client library
        env:
          TN_CLIENTLIB_VERSION: ${{ inputs.clientlib_version || '1.2.1' }}
        run: bash tool/fetch_clientlib.sh
      - run: flutter pub get
      - name: Analyze and test
        run: |
          flutter analyze
          (cd packages/tn_core && dart pub get && dart test)
          flutter test --dart-define=TN_DEMO=true
      - name: Build (no code signing)
        run: |
          flutter build ios --release --no-codesign \
            --dart-define=TN_DEFAULT_NODE="${{ vars.TN_DEFAULT_NODE }}" \
            --dart-define=TN_APP_CLIENT_ID="${{ vars.TN_APP_CLIENT_ID }}" \
            --dart-define=TN_APP_CLIENT_SECRET="${{ secrets.TN_APP_CLIENT_SECRET }}" \
            --dart-define=TN_NETWORK_ROOT_KEY="${{ vars.TN_NETWORK_ROOT_KEY }}" \
            --dart-define=MAP_STYLE_URL="${{ vars.MAP_STYLE_URL }}" \
            --dart-define=MAP_STYLE_URL_DARK="${{ vars.MAP_STYLE_URL_DARK }}"
      - name: Package the .ipa
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry TNViewer-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: TNViewer-unsigned-ipa
          path: TNViewer-unsigned.ipa
          retention-days: 7
